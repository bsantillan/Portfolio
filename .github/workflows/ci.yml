name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mi-portfolio/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de accesibilidad e interacción (axe + Playwright)
        run: npx playwright test

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mi-portfolio/test-results
          retention-days: 7
